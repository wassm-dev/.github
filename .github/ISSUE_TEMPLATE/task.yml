name: 📝 Tarea
description: Crear una tarea para el product backlog
title: "[Tarea]: "
labels: ["tarea", "backlog"]
assignees: []
body:
  - type: input
    id: summary
    attributes:
      label: Resumen de la tarea
      description: Breve descripción de la tarea
      placeholder: "Implementar pantalla de inicio de sesión"
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: Detalles
      description: Más contexto, pasos o notas
      placeholder: "Esta tarea incluye la creación del formulario de login con validación..."
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: Prioridad
      options:
        - P1 (Alta)
        - P2 (Media)
        - P3 (Baja)
        - P4 (No requerido)
    validations:
      required: true

  - type: input
    id: due
    attributes:
      label: Fecha límite
      placeholder: "AAAA-MM-DD"
